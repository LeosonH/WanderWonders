<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Wander</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="home" class="screen">
      <div class="leaf-layer" id="leaf-layer" aria-hidden="true"></div>
      <header class="header">
        <h1>&#127810; Wander</h1>
        <span class="header-meta" id="status-indicator">Idle</span>
      </header>
      <div class="content">
        <div class="card text-center step-card" id="step-card" tabindex="-1">
          <div class="card-subtitle">Today</div>
          <div class="step-count" id="step-count">0</div>
          <div class="card-subtitle" id="goal-label">Goal: 6,000</div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="goal-progress" style="width: 0%"></div>
        </div>

        <div class="data-grid">
          <div class="card">
            <div class="card-subtitle">Distance</div>
            <div class="card-value" id="distance-value">0.0<span class="unit">km</span></div>
          </div>
          <div class="card">
            <div class="card-subtitle">Glow</div>
            <div class="card-value" id="glow-value">0<span class="unit">Glow</span></div>
          </div>
        </div>

        <div class="error-container hidden" id="error">
          <div class="error-icon">&#9888;</div>
          <div class="error-message"></div>
        </div>
      </div>
      <nav class="nav-bar">
        <button class="nav-item primary focusable" id="toggle-btn" data-action="toggle-tracking">Start</button>
        <button class="nav-item focusable" data-action="view-history">History</button>
        <button class="nav-item danger focusable" data-action="reset-today">Reset</button>
      </nav>
    </div>

    <div id="history" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back">&#8592;</button>
        <h1>History</h1>
      </header>
      <div class="content">
        <div class="list-container" id="history-list"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
